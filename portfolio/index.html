<!DOCTYPE html>
<!--
  Page structure only. All visible text, link targets and alt text are filled
  in by script.js from content.js — do not type text into this file.
  Elements with a data-i18n attribute get their text from the active language
  block: the attribute holds a dot path, so hero.name -> PORTFOLIO_CONTENT.en.hero.name.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Fallback only (the one allowed hard-coded text): script.js replaces it with meta.title. -->
  <title>Portfolio</title>
  <meta name="description" content="">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="styles.css">

  <!-- Content first, so the early bootstrap below can read it. -->
  <script src="content.js"></script>
  <!--
    Early bootstrap (runs before first paint, avoids a flash of the wrong
    theme or direction). Uses the same localStorage keys as script.js:
      "portfolio-theme" -> "light" | "dark"
      "portfolio-lang"  -> a language key of PORTFOLIO_CONTENT ("en" | "ar")
  -->
  <script>
    (function () {
      var root = document.documentElement;
      var content = window.PORTFOLIO_CONTENT;
      var theme = null;
      var lang = null;
      root.classList.add("js");
      try {
        theme = localStorage.getItem("portfolio-theme");
        lang = localStorage.getItem("portfolio-lang");
      } catch (e) { /* storage blocked: fall back to defaults */ }
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      root.setAttribute("data-theme", theme);
      if (content) {
        if (!lang || lang === "shared" || !content[lang]) lang = content.shared.defaultLang;
        if (content[lang] && content[lang].meta) {
          root.setAttribute("lang", content[lang].meta.lang);
          root.setAttribute("dir", content[lang].meta.dir);
        }
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="ui.skipLink"></a>

  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="brand" href="#about" data-i18n="hero.name"></a>

      <nav class="site-nav" id="site-nav" data-i18n-aria-label="nav.label">
        <button class="icon-btn nav-toggle" id="nav-toggle" type="button"
                aria-expanded="false" aria-controls="nav-menu">
          <span class="nav-toggle-bars" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
        </button>
        <ul class="nav-menu" id="nav-menu" role="list">
          <li><a class="nav-link" href="#about" data-i18n="nav.about"></a></li>
          <li><a class="nav-link" href="#projects" data-i18n="nav.projects"></a></li>
          <li><a class="nav-link" href="#skills" data-i18n="nav.skills"></a></li>
          <li><a class="nav-link" href="#education" data-i18n="nav.education"></a></li>
          <li><a class="nav-link" href="#certificates" data-i18n="nav.certificates"></a></li>
          <li><a class="nav-link" href="#contact" data-i18n="nav.contact"></a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <button class="lang-toggle" id="lang-toggle" type="button"></button>
        <button class="icon-btn theme-toggle" id="theme-toggle" type="button">
          <!-- Moon: shown in the light theme (action: switch to dark). -->
          <svg class="icon icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/>
          </svg>
          <!-- Sun: shown in the dark theme (action: switch to light). -->
          <svg class="icon icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>
            </g>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- Hero + About -->
    <section class="section hero reveal" id="about" aria-labelledby="about-title">
      <div class="container hero-inner">
        <div class="hero-text">
          <p class="hero-greeting" data-i18n="hero.greeting"></p>
          <h1 class="hero-name" data-i18n="hero.name"></h1>
          <p class="hero-role" data-i18n="hero.role"></p>
          <p class="hero-location">
            <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="currentColor"/>
            </svg>
            <span data-i18n="hero.location"></span>
          </p>
          <p class="hero-tagline" data-i18n="hero.tagline"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="#projects" data-i18n="hero.ctaProjects"></a>
            <a class="btn btn-secondary" href="#contact" data-i18n="hero.ctaContact"></a>
            <a class="btn btn-secondary" id="cv-link" href="assets/cv.pdf" download data-i18n="ui.downloadCv"></a>
          </div>
        </div>
        <img class="hero-avatar" id="hero-avatar" src="assets/avatar.jpg" alt="" width="400" height="400">
      </div>

      <div class="container about">
        <h2 class="section-title" id="about-title" data-i18n="about.title"></h2>
        <div class="about-text" id="about-paragraphs"></div>
      </div>
    </section>

    <!-- Projects -->
    <section class="section reveal" id="projects" aria-labelledby="projects-title">
      <div class="container">
        <h2 class="section-title" id="projects-title" data-i18n="projects.title"></h2>
        <p class="section-intro" data-i18n="projects.intro"></p>
        <ul class="project-grid" id="projects-list" role="list"></ul>
      </div>
    </section>

    <!-- Skills & Experience -->
    <section class="section reveal" id="skills" aria-labelledby="skills-title">
      <div class="container">
        <h2 class="section-title" id="skills-title" data-i18n="skills.title"></h2>
        <div class="skills-layout">
          <div class="skills-block">
            <h3 class="subsection-title" data-i18n="skills.skillsTitle"></h3>
            <ul class="skill-list" id="skills-list" role="list"></ul>
          </div>
          <div class="experience-block">
            <h3 class="subsection-title" data-i18n="experience.title"></h3>
            <ol class="timeline" id="experience-list" role="list"></ol>
          </div>
          <div class="languages-block" id="languages">
            <h3 class="subsection-title" data-i18n="languages.title"></h3>
            <ul class="tag-list" id="languages-list" role="list"></ul>
          </div>
        </div>
      </div>
    </section>

    <!-- Education -->
    <section class="section reveal" id="education" aria-labelledby="education-title">
      <div class="container">
        <h2 class="section-title" id="education-title" data-i18n="education.title"></h2>
        <p class="education-degree" data-i18n="education.degree"></p>
        <p class="education-institution" data-i18n="education.institution"></p>
        <p class="education-period" data-i18n="education.period"></p>
      </div>
    </section>

    <!-- Certificates -->
    <section class="section reveal" id="certificates" aria-labelledby="certificates-title">
      <div class="container">
        <h2 class="section-title" id="certificates-title" data-i18n="certificates.title"></h2>
        <ul class="certificate-list" id="certificates-list" role="list"></ul>
      </div>
    </section>

    <!-- Contact -->
    <section class="section reveal" id="contact" aria-labelledby="contact-title">
      <div class="container">
        <h2 class="section-title" id="contact-title" data-i18n="contact.title"></h2>
        <p class="section-intro" data-i18n="contact.intro"></p>
        <ul class="contact-list" role="list">
          <li>
            <a class="contact-link" id="contact-email">
              <svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm.8 2 8.2 6 8.2-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              </svg>
              <span class="contact-text">
                <span class="contact-label" data-i18n="contact.emailLabel"></span>
                <span class="contact-value" id="contact-email-value" dir="ltr"></span>
              </span>
            </a>
          </li>
          <li>
            <a class="contact-link" id="contact-phone">
              <svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <path d="M6.6 2.5h-2A1.6 1.6 0 0 0 3 4.2C3.4 13.4 10.6 20.6 19.8 21a1.6 1.6 0 0 0 1.7-1.6v-2a1.5 1.5 0 0 0-1.1-1.4l-3.4-1a1.5 1.5 0 0 0-1.5.4l-1.4 1.4a12.1 12.1 0 0 1-5.9-5.9l1.4-1.4a1.5 1.5 0 0 0 .4-1.5l-1-3.4A1.5 1.5 0 0 0 6.6 2.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              </svg>
              <span class="contact-text">
                <span class="contact-label" data-i18n="contact.phoneLabel"></span>
                <span class="contact-value" dir="ltr" data-i18n="contact.phoneDisplay"></span>
              </span>
            </a>
          </li>
          <li>
            <a class="contact-link" id="contact-github" target="_blank" rel="noopener noreferrer">
              <svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 2.9.8.1-.7.4-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7c-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7a3.9 3.9 0 0 1 1 2.7c0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z" fill="currentColor"/>
              </svg>
              <span class="contact-text">
                <span class="contact-label" data-i18n="contact.githubLabel"></span>
              </span>
            </a>
          </li>
          <li>
            <a class="contact-link" id="contact-linkedin" target="_blank" rel="noopener noreferrer">
              <svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <path d="M4.5 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM3 8.5h3V21H3zM9 8.5h2.9v1.7c.4-.8 1.4-1.9 3.4-1.9 3.1 0 3.7 2 3.7 4.7V21h-3v-7.2c0-1.5-.3-2.8-1.9-2.8-1.6 0-2.1 1.2-2.1 2.7V21H9z" fill="currentColor"/>
              </svg>
              <span class="contact-text">
                <span class="contact-label" data-i18n="contact.linkedinLabel"></span>
              </span>
            </a>
          </li>
          <li>
            <a class="contact-link" id="contact-stackoverflow" target="_blank" rel="noopener noreferrer">
              <svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <path d="M4 14.5V21h14v-6.5" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M7.5 17.5h7M7.8 13.9l6.9 1.2M8.6 10.2l6.4 2.9M10.5 6.7l5.5 4.5M13.6 3.5l4.1 5.8" fill="none" stroke="currentColor" stroke-width="2"/>
              </svg>
              <span class="contact-text">
                <span class="contact-label" data-i18n="contact.stackoverflowLabel"></span>
              </span>
            </a>
          </li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-text" data-i18n="footer.text"></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
